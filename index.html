function shaPure(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a));}
  var bytes=Array.from(new TextEncoder().encode(ascii)),i,j;
  var bitLen=bytes.length*8;

  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H0=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  for(i=0;i<bytes.length;i+=64){
    var W=new Array(64);
    for(j=0;j<16;j++)W[j]=((bytes[i+j*4]<<24)|(bytes[i+j*4+1]<<16)|(bytes[i+j*4+2]<<8)|bytes[i+j*4+3])>>>0;
    for(j=16;j<64;j++){
      var s0=rr(W[j-15],7)^rr(W[j-15],18)^(W[j-15]>>>3);
      var s1=rr(W[j-2],17)^rr(W[j-2],19)^(W[j-2]>>>10);
      W[j]=(W[j-16]+s0+W[j-7]+s1)>>>0;
    }
    var a=H0[0],b=H0[1],c=H0[2],d=H0[3],e=H0[4],f=H0[5],g=H0[6],h=H0[7];
    for(j=0;j<64;j++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^((~e)&g),t1=(h+S1+ch+K[j]+W[j])>>>0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22),maj=(a&b)^(a&c)^(b&c),t2=(S0+maj)>>>0;
      h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    H0[0]=(H0[0]+a)>>>0;H0[1]=(H0[1]+b)>>>0;H0[2]=(H0[2]+c)>>>0;H0[3]=(H0[3]+d)>>>0;
    H0[4]=(H0[4]+e)>>>0;H0[5]=(H0[5]+f)>>>0;H0[6]=(H0[6]+g)>>>0;H0[7]=(H0[7]+h)>>>0;
  }
  return H0.map(function(x){return('00000000'+x.toString(16)).slice(-8);}).join('');
}
async function sha(s){
  try{
    if(window.crypto&&crypto.subtle&&typeof TextEncoder!=='undefined'){
      var b=new TextEncoder().encode(s);
      var d=await crypto.subtle.digest('SHA-256',b);
      return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');
    }
  }catch(e){}
  return shaPure(s);
}

  <div id="cloudAppRoot"></div>
  <script>
  (function(){
    if (window.__JT_LOCKED__ || !window.JINTAI_WORKFLOW_PAYLOAD) return;
    var P = window.JINTAI_WORKFLOW_PAYLOAD;
    var st = document.createElement('style');
    st.id = 'wf-base-style';
    st.textContent = P.style || '';
    document.head.appendChild(st);
    var mfix = document.createElement('style');
    mfix.id = 'wf-mobile-fix';
    mfix.textContent =
      '.wf-file,.cli-box{flex-wrap:wrap;}' +
      '.wf-file>span,.wf-perf,.wf-header h2,.wf-block p,.wf-block h3,.spotlight p,.spotlight code,.cli-box code{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;}' +
      '.wf-file>span{word-break:break-all;flex:1 1 220px;}' +
      '.wf-grid,.wf-block,.wf-card,.container,.top-sticky{min-width:0;max-width:100%;}' +
      '@media(max-width:768px){' +
      '.cloud-live-bar,.top-sticky{padding:10px 14px;}' +
      '.container{padding:0 12px;}' +
      '.wf-card,.spotlight{padding:16px 14px;}' +
      '.wf-grid{grid-template-columns:1fr!important;}' +
      '.wf-perf{margin-left:0!important;}' +
      '.search-row{flex-wrap:wrap;}#searchInput{min-width:0;width:100%;font-size:18px;padding:10px 12px;}' +
      '.header-bar h1{font-size:21px;}.wf-header h2{font-size:20px;}' +
      '.json-drawer{padding:14px;}.json-drawer-backdrop{padding:10px;}' +
      '}';
    document.head.appendChild(mfix);

    var root = document.getElementById('cloudAppRoot');
    var bar = document.createElement('div');
    bar.className = 'cloud-live-bar';
    bar.innerHTML =
      '<div class="badge"><span class="dot"></span><span>☁️ 云端自动同步版 · ' +
      P.card_count + ' 组精选工作流 · ' + P.ui_json_count + ' 份 UI .json（+' + P.api_json_count + ' 份 API）· 最近同步：' + P.built_at + '</span></div>' +
      '<div class="cloud-live-actions">' +
      '<button type="button" class="cloud-btn" id="openJsonDrawerBtn">📂 全部工作流文件目录 (' + P.ui_json_count + ')</button>' +
      '</div>';

    var bodyWrap = document.createElement('div');
    bodyWrap.innerHTML = P.body_html || '';

    var drawer = document.createElement('div');
    drawer.id = 'jsonDrawerBackdrop';
    drawer.className = 'json-drawer-backdrop';
    drawer.innerHTML =
      '<div class="json-drawer">' +
      '<div class="json-drawer-head">' +
      '<h2>📂 A 机全部 .json 工作流清单（最新修改排最前）</h2>' +
      '<button type="button" class="copy-btn" id="closeJsonDrawerBtn" style="font-size:18px;padding:8px 16px;">✕ 关闭</button>' +
      '</div>' +
      '<div class="json-drawer-tools">' +
      '<input id="jsonDrawerSearch" type="search" placeholder="输入文件名关键词筛选（如：deno、jzl、prism2、viggle、selflift...）">' +
      '<button type="button" class="cat-pill active" id="jsonFilterAll">全部 (' + P.ui_json_count + ')</button>' +
      '<button type="button" class="cat-pill" id="jsonFilterNew">🆕 尚未归档精选卡</button>' +
      '</div>' +
      '<div class="json-list" id="jsonDrawerList"></div>' +
      '</div>';

    root.appendChild(bar);
    root.appendChild(bodyWrap);
    root.appendChild(drawer);

    window.currentCat = 'ALL';
    window.quickSearch = function(kw){
      window.currentCat = 'ALL';
      document.querySelectorAll('.cat-pill').forEach(function(b, i){ if(b.closest('.cat-row')) b.classList.toggle('active', i === 0); });
      var inp = document.getElementById('searchInput');
      if(inp){ inp.value = kw; window.applyFilters(); }
      var c = document.getElementById('cardsContainer');
      if(c) c.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    window.filterCat = function(cat, btn){
      window.currentCat = cat;
      document.querySelectorAll('.cat-row .cat-pill').forEach(function(b){ b.classList.remove('active'); });
      if(btn) btn.classList.add('active');
      window.applyFilters();
    };
    window.applyFilters = function(){
      var inp = document.getElementById('searchInput');
      var q = inp ? inp.value.trim().toLowerCase() : '';
      document.querySelectorAll('.wf-card').forEach(function(card){
        var matchCat = (window.currentCat === 'ALL') || (card.dataset.cat === window.currentCat);
        var matchQ = !q || (card.dataset.search || '').includes(q);
        card.style.display = (matchCat && matchQ) ? '' : 'none';
      });
    };
    window.copyText = function(txt, btn){
      if(!navigator.clipboard){
        var ta = document.createElement('textarea');
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta);
        if(btn){ var o=btn.textContent; btn.textContent='✓ 已复制'; setTimeout(function(){btn.textContent=o;},1400); }
        return;
      }
      navigator.clipboard.writeText(txt).then(function(){
        if(btn){ var old = btn.textContent; btn.textContent = '✓ 已复制'; setTimeout(function(){ btn.textContent = old; }, 1400); }
      });
    };

    var onlyUncurated = false;
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    function renderJsonList(){
      var q = (document.getElementById('jsonDrawerSearch').value || '').trim().toLowerCase();
      var items = (P.json_catalog || []).filter(function(it){
        if(onlyUncurated && it.is_curated) return false;
        if(q && it.name.toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      var box = document.getElementById('jsonDrawerList');
      if(!items.length){ box.innerHTML = '<div class="json-row">未匹配到对应 .json 文件</div>'; return; }
      box.innerHTML = items.map(function(it){
        var kb = Math.max(1, Math.round(it.size_bytes / 1024));
        var badge = it.is_curated ? '<span class="tag-curated">已入总表</span>' : '<span class="tag-new">🆕 新增/未入精选卡</span>';
        var apiBadge = it.has_api ? '<span class="tag-api">+ .api.json</span>' : '';
        return '<div class="json-row">' +
          '<div><div class="json-name">' + esc(it.name) + '</div>' +
          '<div class="json-meta"><span>🕒 ' + esc(it.mtime_iso) + '</span><span>📦 ' + kb + ' KB</span>' + badge + apiBadge + '</div></div>' +
          '<button type="button" class="copy-btn" data-copy="' + esc(it.name) + '">复制文件名</button>' +
          '</div>';
      }).join('');
      box.querySelectorAll('button[data-copy]').forEach(function(b){
        b.onclick = function(){ window.copyText(b.getAttribute('data-copy'), b); };
      });
    }

    document.getElementById('openJsonDrawerBtn').onclick = function(){
      renderJsonList();
      drawer.classList.add('open');
      setTimeout(function(){ document.getElementById('jsonDrawerSearch').focus(); }, 40);
    };
    document.getElementById('closeJsonDrawerBtn').onclick = function(){ drawer.classList.remove('open'); };
    drawer.onclick = function(e){ if(e.target === drawer) drawer.classList.remove('open'); };
    document.getElementById('jsonDrawerSearch').oninput = renderJsonList;
    document.getElementById('jsonFilterAll').onclick = function(){
      onlyUncurated = false;
      this.classList.add('active');
      document.getElementById('jsonFilterNew').classList.remove('active');
      renderJsonList();
    };
    document.getElementById('jsonFilterNew').onclick = function(){
      onlyUncurated = true;
      this.classList.add('active');
      document.getElementById('jsonFilterAll').classList.remove('active');
      renderJsonList();
    };
    if(location.hash === '#catalog'){ renderJsonList(); drawer.classList.add('open'); }
  })();
  </script>
